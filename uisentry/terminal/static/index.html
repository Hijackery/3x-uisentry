<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>StackSentry — терминал</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="terminal-wrap" class="terminal-wrap" hidden>
    <header class="bar">
      <span class="brand">StackSentry</span>
      <span id="mode" class="badge">shell</span>
      <span id="conn" class="conn">подключено</span>
      <button id="disconnect" class="ghost" type="button">Выйти</button>
    </header>
    <div id="terminal" class="terminal" aria-label="Терминал сервера"></div>
  </main>

  <section id="login" class="login" aria-labelledby="login-title">
    <div class="card">
      <h1 id="login-title">StackSentry</h1>
      <p class="sub">Терминал сервера. Доступ только для администратора.</p>

      <label for="totp">Код из приложения-аутентификатора</label>
      <input id="totp" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" placeholder="000000" required>

      <div id="token-row">
        <label for="token">Access token (если открыто не из Telegram)</label>
        <input id="token" type="password" autocomplete="off"
               placeholder="токен из terminal.env">
      </div>

      <label id="root-row" class="check" hidden>
        <input id="root" type="checkbox">
        <span>Root-сессия <span class="danger">(sudo -i)</span></span>
      </label>

      <button id="connect" class="primary" type="button">Подключиться</button>
      <p id="error" class="error" role="alert"></p>
      <p class="hint">
        Сессия одноразовая и живёт ограниченное время. Не передавайте код и
        токен никому; после выхода тикет недействителен.
      </p>
    </div>
  </section>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
